appId: com.gpsreminder
---
- launchApp:
    clearState: true

# Navigate through onboarding first
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"

# Home screen tests
- assertVisible: "Reminders"
- tapOn: "+ Add Reminder"
- assertVisible: "New Reminder"

# Test back navigation (fixed: "Back" text, not "← Back")
- tapOn: "Back"
- assertVisible: "Reminders"

# Test empty state action (if no reminders)
- tapOn: "Create your first reminder →"
- assertVisible: "New Reminder"

# Test back from create
- tapOn: "Back"
- assertVisible: "Reminders"

# Navigate to settings (skip "See all" since no active reminders)
- tapOn: "Settings"
- assertVisible: "Settings"

# Test notification preferences (should show alert)
- tapOn: "Notification Preferences →"
- assertVisible: "OK"
- tapOn: "OK"

# Test back from settings (use system back button)
- back
- assertVisible: "Reminders"

# Navigate to map tab
- tapOn: "Map"
- assertVisible: "Map"

# Test creating from map tab
- tapOn: "+ Add"
- assertVisible: "New Reminder"

# Test map pin button (stub - sets location directly)
- tapOn: "Map Pin"
# Map stub sets location without alert in test mode
- assertVisible: "New Reminder"

# Test search button (stub - sets location directly)
- tapOn: "Search"
- tapOn: "Search Places"
# Alert shows - tap OK to confirm stub location
- tapOn: "OK"

# Test GPS button (should use stub location)
- tapOn: "Current GPS"
- assertVisible: "New Reminder"

# Test saving a reminder with stub location
# Use Current GPS tab, then "Use Current Location" button to set location
- tapOn: "Current GPS"
- tapOn: "Use Current Location"
# Verify location is set (check for location summary)
- assertVisible: "Selected"
# Enter reminder title (required for save), then dismiss keyboard and scroll to save button
- tapOn: "What do you need to remember?"
- inputText: "Test Reminder"
# Dismiss keyboard by pressing Enter (done button on Android keyboard)
- pressKey: Enter
# Scroll UP (button is above keyboard), then tap save
- scroll
- scroll
- tapOn: "Save Reminder"
- assertVisible: "Saved"
- tapOn: "OK"
# Alert JS callback doesn't fire from Maestro tap — navigate back manually
- back
- assertVisible: "Test Reminder"

# Should navigate back to home with the reminder listed
- assertVisible: "Test Reminder"
